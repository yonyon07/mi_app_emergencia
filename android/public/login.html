<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | Emergencia Conecta</title>
  <style>
    /* Estilos del formulario de acceso, centrado y adaptable a móvil. */
    :root { color-scheme: light; --ink: #142026; --muted: #68777b; --paper: #f5f7f3; --panel: #fff; --accent: #e4572e; --line: #dce5df; }
    * { box-sizing: border-box; }
    body { display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 20px; color: var(--ink); background: radial-gradient(circle at 8% 0%, #fff9ed 0, transparent 32%), var(--paper); font-family: Georgia, 'Times New Roman', serif; }
    main { width: min(100%, 420px); padding: 36px; border: 1px solid var(--line); background: var(--panel); box-shadow: 0 18px 45px rgba(20, 32, 38, .08); }
    .eyebrow { color: #b83e1d; font: 700 12px/1.2 Arial, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
    .creator { margin: 28px 0 0; text-align: center; }
    h1 { margin: 12px 0 8px; font-size: 42px; font-weight: 500; line-height: 1; }
    p { margin: 0 0 28px; color: var(--muted); font: 15px/1.5 Arial, sans-serif; }
    label { display: block; margin: 16px 0 7px; font: 700 12px Arial, sans-serif; }
    input { width: 100%; padding: 13px; border: 1px solid var(--line); font: 16px Arial, sans-serif; }
    button { width: 100%; margin-top: 24px; padding: 14px; border: 0; color: white; background: var(--accent); cursor: pointer; font: 700 14px Arial, sans-serif; }
    #error { min-height: 20px; margin: 14px 0 0; color: #b83e1d; font: 13px Arial, sans-serif; }
  </style>
</head>
<body>
  <!-- Formulario que permite al operador entrar al monitor protegido. -->
  <main>
    <div class="eyebrow">Centro de respuesta</div>
    <h1>Iniciar sesión</h1>
    <p>Accede al monitor de emergencias para continuar.</p>
    <form id="login-form">
      <label for="usuario">Usuario</label>
      <input id="usuario" name="usuario" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
      <div id="error" role="alert"></div>
    </form>
    <footer class="eyebrow creator">Creado por Miguel Leal</footer>
  </main>
  <script>
    // Envía usuario y contraseña al backend y muestra el resultado del acceso.
    document.querySelector('#login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const error = document.querySelector('#error');
      error.textContent = '';
      const form = new FormData(event.currentTarget);
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario: form.get('usuario'), password: form.get('password') })
        });
        const result = await response.json();
        if (response.ok) window.location.href = '/';
        else error.textContent = result.mensaje;
      } catch (_) {
        error.textContent = 'Abre esta página desde http://localhost:3000/login y verifica que el servidor esté iniciado.';
      }
    });
    
  </script>
</body>
</html>
